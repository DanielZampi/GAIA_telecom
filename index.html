<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIA - Asistente Conversacional</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    animation: {
                        'spin-slow': 'spin 20s linear infinite',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Fira+Code:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #050505;
            color: #e5e7eb;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Efecto de cubo de fondo */
        .bg-cubes {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Custom Hook for Scroll Animations ---
        const useScrollReveal = (threshold = 0.2) => {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        setIsVisible(entry.isIntersecting);
                    },
                    {
                        threshold,
                        rootMargin: '0px 0px -50px 0px'
                    }
                );
                if (ref.current) {
                    observer.observe(ref.current);
                }
                return () => observer.disconnect();
            }, [threshold]);

            return [ref, isVisible];
        };

        // --- Configuración de colores neón ---
        const colorMap = {
            cyan: { border: 'border-cyan-500/40', text: 'text-cyan-400', shadow: 'hover:shadow-[0_0_20px_rgba(0,255,255,0.3)]', iconBg: 'bg-cyan-500/10', dash: 'border-cyan-500/50' },
            blue: { border: 'border-blue-500/40', text: 'text-blue-400', shadow: 'hover:shadow-[0_0_20px_rgba(0,150,255,0.3)]', iconBg: 'bg-blue-500/10', dash: 'border-blue-500/50' },
            purple: { border: 'border-purple-500/40', text: 'text-purple-400', shadow: 'hover:shadow-[0_0_20px_rgba(176,38,255,0.3)]', iconBg: 'bg-purple-500/10', dash: 'border-purple-500/50' },
            green: { border: 'border-green-500/40', text: 'text-green-400', shadow: 'hover:shadow-[0_0_20px_rgba(0,255,100,0.3)]', iconBg: 'bg-green-500/10', dash: 'border-green-500/50' },
            orange: { border: 'border-orange-500/40', text: 'text-orange-400', shadow: 'hover:shadow-[0_0_20px_rgba(255,165,0,0.3)]', iconBg: 'bg-orange-500/10', dash: 'border-orange-500/50' },
            pink: { border: 'border-pink-500/40', text: 'text-pink-400', shadow: 'hover:shadow-[0_0_20px_rgba(255,105,180,0.3)]', iconBg: 'bg-pink-500/10', dash: 'border-pink-500/50' },
            red: { border: 'border-red-500/40', text: 'text-red-400', shadow: 'hover:shadow-[0_0_20px_rgba(239,68,68,0.3)]', iconBg: 'bg-red-500/10', dash: 'border-red-500/50' },
            yellow: { border: 'border-yellow-500/40', text: 'text-yellow-400', shadow: 'hover:shadow-[0_0_20px_rgba(234,179,8,0.3)]', iconBg: 'bg-yellow-500/10', dash: 'border-yellow-500/50' },
        };

        // --- Helper Components ---

        // Custom SVG Logo for GAIA (Anillo Moebius / Apertura)
        const GaiaLogo = ({ className = "", size = 160 }) => (
            <svg
                width={size}
                height={size}
                viewBox="0 0 100 100"
                className={className}
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <defs>
                    {/* Gradiente 1: Cyan a Azul Claro */}
                    <linearGradient id="g-cyan-blue" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#00f2fe" />
                        <stop offset="100%" stopColor="#4facfe" />
                    </linearGradient>
                    {/* Gradiente 2: Azul a Púrpura */}
                    <linearGradient id="g-blue-purple" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#4facfe" />
                        <stop offset="100%" stopColor="#7b2ff7" />
                    </linearGradient>
                    {/* Gradiente 3: Púrpura a Azul Profundo */}
                    <linearGradient id="g-purple-dark" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#7b2ff7" />
                        <stop offset="100%" stopColor="#0061ff" />
                    </linearGradient>
                    {/* Gradiente 4: Azul Profundo a Cyan */}
                    <linearGradient id="g-dark-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#0061ff" />
                        <stop offset="100%" stopColor="#00f2fe" />
                    </linearGradient>

                    {/* Sombra para crear el efecto 3D de superposición */}
                    <filter id="petal-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" floodOpacity="0.45" floodColor="#000" />
                    </filter>

                    {/* Clip path para simular el lazo infinito sin costuras */}
                    <clipPath id="top-half-clip">
                        <rect x="-10" y="-10" width="120" height="60" />
                    </clipPath>
                </defs>

                <g>
                    {/* Se dibuja 4 veces el mismo pétalo, rotado 90 grados y con colores secuenciales */}
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-cyan-blue)" filter="url(#petal-shadow)" />
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-blue-purple)" filter="url(#petal-shadow)" transform="rotate(90 50 50)" />
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-purple-dark)" filter="url(#petal-shadow)" transform="rotate(180 50 50)" />
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-dark-cyan)" filter="url(#petal-shadow)" transform="rotate(270 50 50)" />

                    {/* Parche final superpuesto con máscara para cerrar el efecto Moebius (3D) */}
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-cyan-blue)" clipPath="url(#top-half-clip)" filter="url(#petal-shadow)" />
                </g>
            </svg>
        );

        const Icon = ({ name, className = "", size = 24 }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    try {
                        const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                        const temp = document.createElement('div');
                        temp.innerHTML = `<i data-lucide="${kebabName}"></i>`;
                        window.lucide.createIcons({ root: temp });

                        const svg = temp.querySelector('svg');
                        if (svg) {
                            svg.setAttribute('width', size);
                            svg.setAttribute('height', size);
                            if (className) svg.setAttribute('class', className);

                            iconRef.current.innerHTML = '';
                            iconRef.current.appendChild(svg);
                        } else {
                            iconRef.current.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
                        }
                    } catch (e) {
                        console.error("Error al renderizar el icono:", name, e);
                    }
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const SparklesIcon = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3v18" /><path d="M3 12h18" /><path d="m5 5 14 14" /><path d="m19 5-14 14" />
            </svg>
        );

        // --- UI Components ---
        const NeonCard = ({ children, className = "", delay = "0", isVisible }) => (
            <div
                style={{ transitionDelay: `${delay}ms` }}
                className={`relative group bg-gray-900/50 border border-gray-800 rounded-2xl p-6 backdrop-blur-sm 
                transition-all duration-700 ease-out transform
                ${isVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-12 scale-95'}
                ${className}`}
            >
                <div className="absolute inset-0 bg-gradient-to-br from-white/5 to-white/5 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-500" />
                <div className="relative z-10">{children}</div>
            </div>
        );

        const TechBadge = ({ tech, color = "cyan", isVisible, delay = "0" }) => {
            const c = colorMap[color];
            return (
                <span
                    style={{ transitionDelay: `${delay}ms` }}
                    className={`inline-block px-2 py-0.5 mt-1 sm:mt-0 text-[10px] font-mono rounded border ${c.border} bg-gray-900/90 ${c.text} backdrop-blur-md transition-all duration-500 shadow-sm whitespace-nowrap
                ${isVisible ? 'opacity-100 scale-100' : 'opacity-0 scale-75'}`}
                >
                    {tech}
                </span>
            );
        };

        const TreeNode = ({ label, desc, iconName, delay, isVisible, color = "cyan", techBadge, badgeColor }) => {
            const c = colorMap[color];
            return (
                <div style={{ transitionDelay: `${delay}ms` }} className={`relative flex items-start sm:items-center gap-4 transition-all duration-700 w-full ${isVisible ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-12'}`}>
                    <div className={`p-3 rounded-xl border ${c.border} ${c.iconBg} ${c.shadow} transition-shadow duration-300 flex-shrink-0 mt-1 sm:mt-0`}>
                        <Icon name={iconName} size={24} className={c.text} />
                    </div>
                    <div className="flex flex-col sm:flex-row sm:items-center sm:flex-wrap gap-x-3 w-full">
                        <span className="text-white font-bold text-lg leading-tight">{label}</span>
                        {techBadge && <TechBadge tech={techBadge} color={badgeColor || color} isVisible={isVisible} delay={parseInt(delay) + 200} />}
                        {desc && <span className="text-gray-400 text-sm block sm:inline-block w-full sm:w-auto mt-1 sm:mt-0">{desc}</span>}
                    </div>
                </div>
            );
        };

        const BranchItem = ({ label, desc, iconName, delay, isVisible, color = "purple", techBadge, badgeColor }) => {
            const c = colorMap[color];
            return (
                <div className="relative flex items-start mt-6 group w-full">
                    <div
                        style={{ transitionDelay: `${parseInt(delay) - 100}ms` }}
                        className={`w-6 sm:w-12 border-t-2 border-dashed ${c.dash} transition-all duration-500 origin-left mt-5 ${isVisible ? 'opacity-100 scale-x-100' : 'opacity-0 scale-x-0'}`}
                    />

                    <div style={{ transitionDelay: `${delay}ms` }} className={`relative ml-2 sm:ml-3 flex items-start sm:items-center gap-3 transition-all duration-700 w-full ${isVisible ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-8'}`}>
                        <div className={`p-2 rounded-lg border ${c.border} ${c.iconBg} ${c.shadow} transition-shadow duration-300 flex-shrink-0 mt-1 sm:mt-0`}>
                            <Icon name={iconName} size={18} className={c.text} />
                        </div>
                        <div className="flex flex-col sm:flex-row sm:items-center sm:flex-wrap gap-x-2 gap-y-1 w-full">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-white font-mono font-bold text-sm bg-gray-900 px-2 py-1 rounded-md">{label}</span>
                                {techBadge && <TechBadge tech={techBadge} color={badgeColor || color} isVisible={isVisible} delay={parseInt(delay) + 200} />}
                            </div>
                            {desc && (
                                <div className="flex items-start sm:items-center gap-1 mt-1 sm:mt-0">
                                    <span className="text-gray-400 font-mono text-xs hidden sm:block">➔</span>
                                    <span className="text-gray-400 font-mono text-xs">{desc}</span>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const FileTreeLine = ({ text }) => {
            const commentMatch = text.match(/\s{2,}([A-Z].*)/);
            let mainText = text;
            let comment = "";

            if (commentMatch) {
                mainText = text.substring(0, commentMatch.index);
                comment = commentMatch[1];
            }

            let textStyle = "text-gray-300";
            if (mainText.includes('.py')) textStyle = "text-yellow-300";
            else if (mainText.includes('.json') || mainText.includes('.yml')) textStyle = "text-green-300";
            else if (mainText.includes('.md') || mainText.includes('.txt') || mainText.includes('.example') || mainText.includes('.gitignore') || mainText.includes('Makefile')) textStyle = "text-gray-400";
            else if (mainText.trim().endsWith('/')) textStyle = "text-blue-400 font-bold";

            const nameMatch = mainText.match(/([a-zA-Z0-9_.-]+\/?)\s*$/);
            let structure = mainText;
            let name = "";

            if (nameMatch) {
                name = nameMatch[1];
                structure = mainText.substring(0, nameMatch.index);
            }

            return (
                <div className="font-mono text-xs sm:text-sm whitespace-pre flex">
                    <span className="text-purple-500/50">{structure}</span>
                    <span className={textStyle}>{name}</span>
                    {comment && <span className="text-gray-500 italic ml-2"># {comment}</span>}
                </div>
            );
        }

        const PrincipleCard = ({ title, desc, iconName, color, delay, isVisible }) => {
            const c = colorMap[color];
            return (
                <div
                    style={{ transitionDelay: `${delay}ms` }}
                    className={`relative group bg-gray-900/40 border border-gray-800 rounded-2xl p-6 transition-all duration-700 ease-out transform overflow-hidden
                ${isVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-12 scale-95'}
                hover:border-${color}-500/50 hover:bg-gray-800/60`}
                >
                    <div className={`absolute -right-10 -top-10 w-32 h-32 bg-${color}-500/10 rounded-full blur-3xl group-hover:bg-${color}-500/20 transition-all duration-500`}></div>

                    <div className="relative z-10">
                        <div className={`w-12 h-12 rounded-xl mb-4 flex items-center justify-center border ${c.border} ${c.iconBg} ${c.text}`}>
                            <Icon name={iconName} size={24} />
                        </div>
                        <h3 className="text-xl font-bold text-white mb-2">{title}</h3>
                        <p className="text-gray-400 text-sm leading-relaxed">{desc}</p>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [heroRef, heroVisible] = useScrollReveal(0.3);
            const [probRef, probVisible] = useScrollReveal(0.2);
            const [descRef, descVisible] = useScrollReveal(0.2);
            const [uxRef, uxVisible] = useScrollReveal(0.15);
            const [convRef, convVisible] = useScrollReveal(0.2);
            const [memRef, memVisible] = useScrollReveal(0.2);
            const [treeRef, treeVisible] = useScrollReveal(0.2);
            const [archRef, archVisible] = useScrollReveal(0.1);
            const [pipeRef, pipeVisible] = useScrollReveal(0.15);

            return (
                <div className="min-h-screen bg-[#050505] text-gray-200 font-sans selection:bg-purple-500/30">

                    {/* Background Effects */}
                    <div className="fixed inset-0 z-0 pointer-events-none">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/10 rounded-full blur-[120px]" />
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/10 rounded-full blur-[120px]" />
                        <div className="absolute inset-0 bg-cubes opacity-10" />
                    </div>

                    {/* --- HERO SECTION --- */}
                    <section ref={heroRef} className="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 text-center pt-10">
                        <div className={`transition-all duration-1000 ease-out ${heroVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 -translate-y-10 scale-95'}`}>

                            {/* --- SVG LOGO INSERTADO AQUÍ --- */}
                            <div className="flex justify-center mb-10">
                                <GaiaLogo className="animate-spin-slow drop-shadow-[0_0_30px_rgba(79,172,254,0.3)]" size={140} />
                            </div>

                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-900/30 border border-blue-500/30 text-blue-400 text-sm mb-6">
                                <SparklesIcon /> Plataforma Inteligente HCAI
                            </div>
                            <h1 className="text-6xl md:text-8xl font-black mb-6 tracking-tighter">
                                Conoce a <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-cyan-400 drop-shadow-[0_0_15px_rgba(176,38,255,0.4)]">GAIA</span>
                            </h1>
                            <p className="text-xl md:text-2xl text-gray-400 max-w-3xl mx-auto mb-10 leading-relaxed">
                                Asistente Conversacional de Telecomunicaciones con GenAI UX.
                                <br className="hidden md:block" /> Elevando el servicio al cliente con empatía, RAG y LangGraph.
                            </p>
                        </div>

                        <div className={`absolute bottom-10 animate-bounce text-gray-500 transition-opacity duration-500 ${heroVisible ? 'opacity-100' : 'opacity-0'}`}>
                            <Icon name="ChevronDown" size={32} />
                        </div>
                    </section>

                    {/* --- 1. PLANTEAMIENTO DEL PROBLEMA --- */}
                    <section ref={probRef} className="relative z-10 py-24 px-6 md:px-20 max-w-7xl mx-auto border-t border-gray-800/50">
                        <div className={`transition-all duration-1000 ${probVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-16'}`}>

                            <div className="flex items-center justify-center md:justify-start gap-3 mb-10">
                                <div className="p-3 bg-red-500/10 rounded-xl border border-red-500/20 shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                                    <Icon name="AlertCircle" className="text-red-400" size={32} />
                                </div>
                                <h2 className="text-3xl md:text-4xl font-bold text-white text-center md:text-left">El Desafío del Sector</h2>
                            </div>

                            <div className="grid md:grid-cols-2 gap-16 items-center">
                                <div>
                                    <p className="text-gray-400 text-lg mb-6 leading-relaxed">
                                        El sector de telecomunicaciones en Colombia opera con más de <strong className="text-white">92,1 millones de líneas móviles activas</strong>, generando una demanda de atención al cliente masiva. Sin embargo, los canales automatizados están fallando.
                                    </p>
                                    <p className="text-gray-400 text-lg mb-6 leading-relaxed">
                                        Los chatbots actuales operan bajo <span className="text-orange-400 font-medium">lógicas rígidas</span> basadas en palabras clave o modelos NLP genéricos. Son ineficaces para resolver consultas complejas, no se adaptan a la diversidad lingüística del país y carecen de interacciones empáticas.
                                    </p>
                                    <p className="text-gray-400 text-lg leading-relaxed">
                                        Aunque la CRC reporta una reducción de quejas, la <strong className="text-red-400">insatisfacción en canales automatizados subió del 32% al 43%</strong>. Esta brecha destruye el NPS, reduce la Tasa de Resolución en Primer Contacto (TRPC) y eleva drásticamente el <strong className="text-red-400">Churn</strong> (abandono), donde los costos de adquisición superan con creces a los de retención.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <NeonCard delay="100" className="border-orange-500/30 hover:border-orange-400/60 bg-orange-950/20" isVisible={probVisible}>
                                        <Icon name="Users" className="text-orange-400 mb-4" size={28} />
                                        <div className="text-3xl font-black text-white mb-2">92.1M</div>
                                        <p className="text-sm text-gray-400">Líneas móviles activas en Colombia.</p>
                                    </NeonCard>
                                    <NeonCard delay="200" className="border-red-500/30 hover:border-red-400/60 bg-red-950/20" isVisible={probVisible}>
                                        <Icon name="TrendingUp" className="text-red-400 mb-4" size={28} />
                                        <div className="text-3xl font-black text-white mb-2">43%</div>
                                        <p className="text-sm text-gray-400">Insatisfacción en soporte de internet.</p>
                                    </NeonCard>
                                    <NeonCard delay="300" className="border-yellow-500/30 hover:border-yellow-400/60 bg-yellow-950/20" isVisible={probVisible}>
                                        <Icon name="Bot" className="text-yellow-400 mb-4" size={28} />
                                        <div className="text-xl font-bold text-white mb-2">Chatbots Rígidos</div>
                                        <p className="text-sm text-gray-400">Sin empatía ni adaptación lingüística.</p>
                                    </NeonCard>
                                    <NeonCard delay="400" className="border-pink-500/30 hover:border-pink-400/60 bg-pink-950/20" isVisible={probVisible}>
                                        <Icon name="PhoneMissed" className="text-pink-400 mb-4" size={28} />
                                        <div className="text-xl font-bold text-white mb-2">Alto Churn</div>
                                        <p className="text-sm text-gray-400">Costos de adquisición por fugas de clientes.</p>
                                    </NeonCard>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* --- 2. LA SOLUCIÓN: QUÉ ES GAIA --- */}
                    <section ref={descRef} className="relative z-10 py-24 px-6 md:px-20 max-w-7xl mx-auto border-t border-gray-800/50">
                        <div className="grid md:grid-cols-2 gap-16 items-center">
                            <div className={`transition-all duration-1000 delay-100 ${descVisible ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-20'}`}>
                                <h2 className="text-3xl md:text-4xl font-bold mb-6 text-white text-center md:text-left">¿Qué es GAIA?</h2>
                                <p className="text-gray-400 text-lg mb-6 leading-relaxed">
                                    GAIA es la respuesta a este desafío. Es una <strong className="text-purple-400">plataforma conversacional inteligente</strong> desarrollada para transformar el servicio al cliente de operadores en Colombia (Claro, Movistar, Tigo).
                                </p>
                                <p className="text-gray-400 text-lg mb-6 leading-relaxed">
