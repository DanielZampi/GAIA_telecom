<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIA - Asistente Conversacional</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    animation: {
                        'spin-slow': 'spin 20s linear infinite',
                        'chat-float-1': 'chatFloat 6s ease-in-out infinite',
                        'chat-float-2': 'chatFloat 6s ease-in-out infinite 2s',
                        'chat-float-3': 'chatFloat 6s ease-in-out infinite 4s',
                        'chat-glow-blue': 'chatGlowBlue 4s ease-in-out infinite',
                        'chat-glow-purple': 'chatGlowPurple 4s ease-in-out infinite 2s',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        chatFloat: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' },
                        },
                        chatGlowBlue: {
                            '0%, 100%': { boxShadow: '0 0 10px rgba(0, 150, 255, 0.1)' },
                            '50%': { boxShadow: '0 0 30px rgba(0, 150, 255, 0.5)' },
                        },
                        chatGlowPurple: {
                            '0%, 100%': { boxShadow: '0 0 10px rgba(176, 38, 255, 0.1)' },
                            '50%': { boxShadow: '0 0 30px rgba(176, 38, 255, 0.5)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Fira+Code:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #050505;
            color: #e5e7eb;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Efecto de cubo de fondo */
        .bg-cubes {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Custom Hook for Scroll Animations ---
        const useScrollReveal = (threshold = 0.2) => {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        setIsVisible(entry.isIntersecting);
                    },
                    {
                        threshold,
                        rootMargin: '0px 0px -50px 0px'
                    }
                );
                if (ref.current) {
                    observer.observe(ref.current);
                }
                return () => observer.disconnect();
            }, [threshold]);

            return [ref, isVisible];
        };

        // --- Configuración de colores neón ---
        const colorMap = {
            cyan: { border: 'border-cyan-500/40', text: 'text-cyan-400', shadow: 'hover:shadow-[0_0_20px_rgba(0,255,255,0.3)]', iconBg: 'bg-cyan-500/10', dash: 'border-cyan-500/50' },
            blue: { border: 'border-blue-500/40', text: 'text-blue-400', shadow: 'hover:shadow-[0_0_20px_rgba(0,150,255,0.3)]', iconBg: 'bg-blue-500/10', dash: 'border-blue-500/50' },
            purple: { border: 'border-purple-500/40', text: 'text-purple-400', shadow: 'hover:shadow-[0_0_20px_rgba(176,38,255,0.3)]', iconBg: 'bg-purple-500/10', dash: 'border-purple-500/50' },
            green: { border: 'border-green-500/40', text: 'text-green-400', shadow: 'hover:shadow-[0_0_20px_rgba(0,255,100,0.3)]', iconBg: 'bg-green-500/10', dash: 'border-green-500/50' },
            orange: { border: 'border-orange-500/40', text: 'text-orange-400', shadow: 'hover:shadow-[0_0_20px_rgba(255,165,0,0.3)]', iconBg: 'bg-orange-500/10', dash: 'border-orange-500/50' },
            pink: { border: 'border-pink-500/40', text: 'text-pink-400', shadow: 'hover:shadow-[0_0_20px_rgba(255,105,180,0.3)]', iconBg: 'bg-pink-500/10', dash: 'border-pink-500/50' },
            red: { border: 'border-red-500/40', text: 'text-red-400', shadow: 'hover:shadow-[0_0_20px_rgba(239,68,68,0.3)]', iconBg: 'bg-red-500/10', dash: 'border-red-500/50' },
            yellow: { border: 'border-yellow-500/40', text: 'text-yellow-400', shadow: 'hover:shadow-[0_0_20px_rgba(234,179,8,0.3)]', iconBg: 'bg-yellow-500/10', dash: 'border-yellow-500/50' },
        };

        // --- Helper Components ---
        
        // Custom SVG Logo for GAIA (Anillo Moebius / Apertura)
        const GaiaLogo = ({ className = "", size = 160 }) => (
            <svg
                width={size}
                height={size}
                viewBox="0 0 100 100"
                className={className}
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <defs>
                    <linearGradient id="g-cyan-blue" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#00f2fe" />
                        <stop offset="100%" stopColor="#4facfe" />
                    </linearGradient>
                    <linearGradient id="g-blue-purple" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#4facfe" />
                        <stop offset="100%" stopColor="#7b2ff7" />
                    </linearGradient>
                    <linearGradient id="g-purple-dark" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#7b2ff7" />
                        <stop offset="100%" stopColor="#0061ff" />
                    </linearGradient>
                    <linearGradient id="g-dark-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stopColor="#0061ff" />
                        <stop offset="100%" stopColor="#00f2fe" />
                    </linearGradient>
                    
                    <filter id="petal-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" floodOpacity="0.45" floodColor="#000" />
                    </filter>

                    <clipPath id="top-half-clip">
                        <rect x="-10" y="-10" width="120" height="60" />
                    </clipPath>
                </defs>

                <g>
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-cyan-blue)" filter="url(#petal-shadow)" />
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-blue-purple)" filter="url(#petal-shadow)" transform="rotate(90 50 50)" />
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-purple-dark)" filter="url(#petal-shadow)" transform="rotate(180 50 50)" />
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-dark-cyan)" filter="url(#petal-shadow)" transform="rotate(270 50 50)" />
                    <path d="M 50 5 A 45 45 0 0 1 95 50 A 45 45 0 0 1 50 95 C 68 95 73 75 73 50 C 73 25 68 5 50 5 Z" fill="url(#g-cyan-blue)" clipPath="url(#top-half-clip)" filter="url(#petal-shadow)" />
                </g>
            </svg>
        );

        const Icon = ({ name, className = "", size = 24 }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    try {
                        const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                        const temp = document.createElement('div');
                        temp.innerHTML = `<i data-lucide="${kebabName}"></i>`;
                        window.lucide.createIcons({ root: temp });

                        const svg = temp.querySelector('svg');
                        if (svg) {
                            svg.setAttribute('width', size);
                            svg.setAttribute('height', size);
                            if (className) svg.setAttribute('class', className);

                            iconRef.current.innerHTML = '';
                            iconRef.current.appendChild(svg);
                        } else {
                            iconRef.current.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
                        }
                    } catch (e) {
                        console.error("Error al renderizar el icono:", name, e);
                    }
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const SparklesIcon = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3v18" /><path d="M3 12h18" /><path d="m5 5 14 14" /><path d="m19 5-14 14" />
            </svg>
        );

        // --- UI Components ---
        const NeonCard = ({ children, className = "", delay = "0", isVisible }) => (
            <div
                style={{ transitionDelay: `${delay}ms` }}
                className={`relative group bg-gray-900/50 border border-gray-800 rounded-2xl p-6 backdrop-blur-sm 
                transition-all duration-700 ease-out transform
                ${isVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-12 scale-95'}
                ${className}`}
            >
                <div className="absolute inset-0 bg-gradient-to-br from-white/5 to-white/5 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-500" />
                <div className="relative z-10">{children}</div>
            </div>
        );

        const TechBadge = ({ tech, color = "cyan", isVisible, delay = "0" }) => {
            const c = colorMap[color];
            return (
                <span
                    style={{ transitionDelay: `${delay}ms` }}
                    className={`inline-block px-2 py-0.5 mt-1 sm:mt-0 text-[10px] font-mono rounded border ${c.border} bg-gray-900/90 ${c.text} backdrop-blur-md transition-all duration-500 shadow-sm whitespace-nowrap
                ${isVisible ? 'opacity-100 scale-100' : 'opacity-0 scale-75'}`}
                >
                    {tech}
                </span>
            );
        };

        const TreeNode = ({ label, desc, iconName, delay, isVisible, color = "cyan", techBadge, badgeColor, tooltip }) => {
            const c = colorMap[color];
            return (
                <div style={{ transitionDelay: `${delay}ms` }} className={`relative flex items-start sm:items-center gap-4 transition-all duration-700 w-full ${isVisible ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-12'}`}>
                    <div className={`p-3 rounded-xl border ${c.border} ${c.iconBg} ${c.shadow} transition-all duration-300 flex-shrink-0 mt-1 sm:mt-0 relative group cursor-help hover:scale-110 z-20`}>
                        <Icon name={iconName} size={24} className={c.text} />
                        
                        {/* Tooltip flotante */}
                        {tooltip && (
                            <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-3 py-2 bg-[#111] border border-gray-700 text-gray-300 text-xs rounded-lg opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none whitespace-normal min-w-[160px] w-max max-w-[220px] text-center shadow-2xl shadow-black scale-95 group-hover:scale-100 leading-relaxed z-50">
                                {tooltip}
                                <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-gray-700"></div>
                            </div>
                        )}
                    </div>
                    <div className="flex flex-col sm:flex-row sm:items-center sm:flex-wrap gap-x-3 w-full">
                        <span className="text-white font-bold text-lg leading-tight">{label}</span>
                        {techBadge && <TechBadge tech={techBadge} color={badgeColor || color} isVisible={isVisible} delay={parseInt(delay) + 200} />}
                        {desc && <span className="text-gray-400 text-sm block sm:inline-block w-full sm:w-auto mt-1 sm:mt-0">{desc}</span>}
                    </div>
                </div>
            );
        };

        const BranchItem = ({ label, desc, iconName, delay, isVisible, color = "purple", techBadge, badgeColor, tooltip }) => {
            const c = colorMap[color];
            return (
                <div className="relative flex items-start mt-6 w-full">
                    <div
                        style={{ transitionDelay: `${parseInt(delay) - 100}ms` }}
                        className={`w-6 sm:w-12 border-t-2 border-dashed ${c.dash} transition-all duration-500 origin-left mt-5 ${isVisible ? 'opacity-100 scale-x-100' : 'opacity-0 scale-x-0'} z-0`}
                    />

                    <div style={{ transitionDelay: `${delay}ms` }} className={`relative ml-2 sm:ml-3 flex items-start sm:items-center gap-3 transition-all duration-700 w-full ${isVisible ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-8'}`}>
                        <div className={`p-2 rounded-lg border ${c.border} ${c.iconBg} ${c.shadow} transition-all duration-300 flex-shrink-0 mt-1 sm:mt-0 relative group cursor-help hover:scale-110 z-20`}>
                            <Icon name={iconName} size={18} className={c.text} />
                            
                            {/* Tooltip flotante */}
                            {tooltip && (
                                <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-3 py-2 bg-[#111] border border-gray-700 text-gray-300 text-xs rounded-lg opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none whitespace-normal min-w-[160px] w-max max-w-[220px] text-center shadow-2xl shadow-black scale-95 group-hover:scale-100 leading-relaxed z-50">
                                    {tooltip}
                                    <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-gray-700"></div>
                                </div>
                            )}
                        </div>
                        <div className="flex flex-col sm:flex-row sm:items-center sm:flex-wrap gap-x-2 gap-y-1 w-full">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-white font-mono font-bold text-sm bg-gray-900 px-2 py-1 rounded-md">{label}</span>
                                {techBadge && <TechBadge tech={techBadge} color={badgeColor || color} isVisible={isVisible} delay={parseInt(delay) + 200} />}
                            </div>
                            {desc && (
                                <div className="flex items-start sm:items-center gap-1 mt-1 sm:mt-0">
                                    <span className="text-gray-400 font-mono text-xs hidden sm:block">➔</span>
                                    <span className="text-gray-400 font-mono text-xs">{desc}</span>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const FileTreeLine = ({ text }) => {
            const commentMatch = text.match(/\s{2,}([A-Z].*)/);
            let mainText = text;
            let comment = "";

            if (commentMatch) {
                mainText = text.substring(0, commentMatch.index);
                comment = commentMatch[1];
            }

            let textStyle = "text-gray-300";
            if (mainText.includes('.py')) textStyle = "text-yellow-300";
            else if (mainText.includes('.json') || mainText.includes('.yml')) textStyle = "text-green-300";
            else if (mainText.includes('.md') || mainText.includes('.txt') || mainText.includes('.example') || mainText.includes('.gitignore') || mainText.includes('Makefile')) textStyle = "text-gray-400";
            else if (mainText.trim().endsWith('/')) textStyle = "text-blue-400 font-bold";

            const nameMatch = mainText.match(/([a-zA-Z0-9_.-]+\/?)\s*$/);
            let structure = mainText;
            let name = "";

            if (nameMatch) {
                name = nameMatch[1];
                structure = mainText.substring(0, nameMatch.index);
            }

            return (
                <div className="font-mono text-xs sm:text-sm whitespace-pre flex">
                    <span className="text-purple-500/50">{structure}</span>
                    <span className={textStyle}>{name}</span>
                    {comment && <span className="text-gray-500 italic ml-2"># {comment}</span>}
                </div>
            );
        }

        const PrincipleCard = ({ title, desc, iconName, color, delay, isVisible }) => {
            const c = colorMap[color];
            return (
                <div
                    style={{ transitionDelay: `${delay}ms` }}
                    className={`relative group bg-gray-900/40 border border-gray-800 rounded-2xl p-6 transition-all duration-700 ease-out transform overflow-hidden
                ${isVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-12 scale-95'}
                hover:border-${color}-500/50 hover:bg-gray-800/60`}
                >
                    <div className={`absolute -right-10 -top-10 w-32 h-32 bg-${color}-500/10 rounded-full blur-3xl group-hover:bg-${color}-500/20 transition-all duration-500`}></div>

                    <div className="relative z-10">
                        <div className={`w-12 h-12 rounded-xl mb-4 flex items-center justify-center border ${c.border} ${c.iconBg} ${c.text}`}>
                            <Icon name={iconName} size={24} />
                        </div>
                        <h3 className="text-xl font-bold text-white mb-2">{title}</h3>
                        <p className="text-gray-400 text-sm leading-relaxed">{desc}</p>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [heroRef, heroVisible] = useScrollReveal(0.3);
            const [probRef, probVisible] = useScrollReveal(0.2);
            const [descRef, descVisible] = useScrollReveal(0.2);
            const [uxRef, uxVisible] = useScrollReveal(0.15);
            const [convRef, convVisible] = useScrollReveal(0.2);
            const [memRef, memVisible] = useScrollReveal(0.2);
            
            // Refs para Negocio y Mercado
            const [marketRef, marketVisible] = useScrollReveal(0.2);
            const [bizRef, bizVisible] = useScrollReveal(0.2);
            
            // Refs para Arquitectura Técnica
            const [appendixRef, appendixVisible] = useScrollReveal(0.3);
            const [treeRef, treeVisible] = useScrollReveal(0.2);
            const [archRef, archVisible] = useScrollReveal(0.1);
            const [pipeRef, pipeVisible] = useScrollReveal(0.15);

            return (
                <div className="min-h-screen bg-[#050505] text-gray-200 font-sans selection:bg-purple-500/30">

                    {/* Background Effects */}
                    <div className="fixed inset-0 z-0 pointer-events-none">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/10 rounded-full blur-[120px]" />
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/10 rounded-full blur-[120px]" />
                        <div className="absolute inset-0 bg-cubes opacity-10" />
                    </div>

                    {/* --- HERO SECTION --- */}
                    <section ref={heroRef} className="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 text-center pt-10">
                        <div className={`transition-all duration-1000 ease-out ${heroVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 -translate-y-10 scale-95'}`}>
                            
                            <div className="flex justify-center mb-10">
                                <GaiaLogo className="animate-spin-slow drop-shadow-[0_0_30px_rgba(79,172,254,0.3)]" size={140} />
                            </div>

                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-900/30 border border-blue-500/30 text-blue-400 text-sm mb-6 shadow-[0_0_15px_rgba(0,150,255,0.2)]">
                                <SparklesIcon /> Plataforma de IA Centrada en el Usuario
                            </div>
                            <h1 className="text-6xl md:text-8xl font-black mb-6 tracking-tighter">
                                Conoce a <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-cyan-400 drop-shadow-[0_0_15px_rgba(176,38,255,0.4)]">GAIA</span>
                            </h1>
                            <p className="text-xl md:text-2xl text-gray-400 max-w-3xl mx-auto mb-10 leading-relaxed font-light">
                                Asistente Conversacional Centrado en el Usuario para Empresas de Telecomunicaciones
                            </p>
                        </div>

                        <div className={`absolute bottom-10 animate-bounce text-gray-500 transition-opacity duration-500 ${heroVisible ? 'opacity-100' : 'opacity-0'}`}>
                            <Icon name="ChevronDown" size={32} />
                        </div>
                    </section>

                    {/* --- 1. PLANTEAMIENTO DEL PROBLEMA --- */}
                    <section ref={probRef} className="relative z-10 py-24 px-6 md:px-20 max-w-7xl mx-auto border-t border-gray-800/50">
                        <div className={`transition-all duration-1000 ${probVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-16'}`}>

                            <div className="flex items-center justify-center md:justify-start gap-3 mb-10">
                                <div className="p-3 bg-red-500/10 rounded-xl border border-red-500/20 shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                                    <Icon name="AlertCircle" className="text-red-400" size={32} />
                                </div>
                                <h2 className="text-3xl md:text-4xl font-bold text-white text-center md:text-left">El Desafío del Sector</h2>
                            </div>

                            <div className="grid md:grid-cols-2 gap-16 items-center">
                                <div>
                                    <p className="text-gray-400 text-lg mb-6 leading-relaxed">
                                        El sector de telecomunicaciones en Colombia opera con más de <strong className="text-white">92,1 millones de líneas móviles activas</strong>, generando una demanda de atención al usuario masiva. Sin embargo, los canales automatizados están fallando.
                                    </p>
                                    <p className="text-gray-400 text-lg mb-6 leading-relaxed">
                                        Los chatbots actuales operan bajo <span className="text-orange-400 font-medium">lógicas rígidas</span> basadas en palabras clave o modelos NLP genéricos. Son ineficaces para resolver consultas complejas, no se adaptan a la diversidad lingüística del país y carecen de interacciones empáticas.
                                    </p>
                                    <p className="text-gray-400 text-lg leading-relaxed">
                                        Aunque la CRC reporta una reducción de quejas, la <strong className="text-red-400">insatisfacción en canales automatizados subió del 32% al 43%</strong>. Esta brecha destruye el NPS, reduce la Tasa de Resolución en Primer Contacto (TRPC) y eleva drásticamente el <strong className="text-red-400">Churn</strong> (abandono), donde los costos de adquisición superan con creces a los de retención.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <NeonCard delay="100" className="border-orange-500/30 hover:border-orange-400/60 bg-orange-950/20" isVisible={probVisible}>
                                        <Icon name="Users" className="text-orange-400 mb-4" size={28} />
                                        <div className="text-3xl font-black text-white mb-2">92.1M</div>
                                        <p className="text-sm text-gray-400">Líneas móviles activas en Colombia.</p>
                                    </NeonCard>

                                </div>

                                {/* Fase 2 */}
                                <div className="flex-1 relative z-10 bg-[#0a0a0e] border border-gray-800 rounded-2xl p-8 hover:border-purple-500/50 transition-colors shadow-xl group">

                                    <div className="w-12 h-12 bg-purple-500/20 text-purple-400 rounded-xl flex items-center justify-center mb-6">

                                    </div>

                                    <ul className="text-sm text-gray-500 space-y-2 font-mono">
                                        <li className="flex items-center gap-2"><Icon name="CheckCircle2" size={14} className="text-purple-500" /> Despliegue de LangGraph</li>
                                        <li className="flex items-center gap-2"><Icon name="CheckCircle2" size={14} className="text-purple-500" /> Volumen de tokens optimizado</li>
                                        <li className="flex items-center gap-2"><Icon name="CheckCircle2" size={14} className="text-purple-500" /> Monitoreo y métricas (MLflow)</li>
                                    </ul>
                                </div>
                            </div>

                                </div>
                            </div>
                        </div>
                    </section>

                    {/* --- 8. APÉNDICE: PROFUNDIZACIÓN TÉCNICA --- */}
                    <div className="relative z-10 w-full bg-gradient-to-b from-transparent via-[#050505] to-[#0a0a0e]">
                        
                        {/* Título Separador */}
                        <section ref={appendixRef} className="py-20 px-6 md:px-20 max-w-7xl mx-auto border-t border-gray-800/50">
                            <div className={`text-center flex flex-col items-center transition-all duration-1000 ${appendixVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-16'}`}>

                                    Para quienes quieran profundizar:
                                </h2>
                                <div className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-cyan-900/30 border border-cyan-500/30 text-cyan-400 text-sm md:text-base mb-8 shadow-[0_0_15px_rgba(0,255,255,0.2)]">
                                    <Icon name="Layers" size={18} /> Arquitectura y stack tecnológico
                                </div>
                                <div className="w-24 h-1 bg-purple-500/50 mx-auto rounded-full"></div>
                            </div>
                        </section>

                        {/* --- ESTRUCTURA DEL PROYECTO --- */}
                        <section ref={treeRef} className="py-10 px-6 md:px-20 max-w-7xl mx-auto">

                                </div>

                                <div className="max-w-4xl mx-auto rounded-xl overflow-hidden border border-gray-800 bg-[#0d0d12] shadow-2xl">
                                    {/* Terminal Header */}

                                        <div className="flex gap-2">
                                            <div className="w-3 h-3 rounded-full bg-red-500/80"></div>
                                            <div className="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                                            <div className="w-3 h-3 rounded-full bg-green-500/80"></div>
                                        </div>
                                        <div className="text-xs font-mono text-gray-500 flex items-center gap-2">
                                            <Icon name="FolderOpen" size={14} /> dimarior/telecom-chatbot
                                        </div>
                                        <div></div> {/* Spacer */}
                                    </div>

                                    {/* Terminal Body */}
                                    <div className="p-4 sm:p-6 overflow-x-auto text-sm sm:text-base leading-relaxed bg-[#0d0d12]">

                                        <FileTreeLine text="+-- app/" />
                                        <FileTreeLine text="|   +-- assets/                  Logos, imagenes, favicon, banner" />
                                        <FileTreeLine text="|   +-- streamlit_app.py         Interfaz GAIA con selector de operadores" />
                                        <FileTreeLine text="|" />
                                        <FileTreeLine text="+-- api/" />
                                        <FileTreeLine text="|   +-- main.py                  FastAPI con endpoints /ask y /ask/graph" />
                                        <FileTreeLine text="|   +-- __init__.py" />
                                        <FileTreeLine text="|" />
                                        <FileTreeLine text="+-- src/" />
                                        <FileTreeLine text="|   +-- config.py                Configuracion centralizada desde .env" />
                                        <FileTreeLine text="|   +-- scraper.py               Web scraper anti-deteccion con seed URLs" />
                                        <FileTreeLine text="|   +-- ingest.py                Chunking, embeddings y construccion de ChromaDB" />
                                        <FileTreeLine text="|   +-- rag_chain.py             Pipeline RAG simple con MLflow tracing" />
                                        <FileTreeLine text="|   +-- memory.py                Memoria persistente en SQLite" />
                                        <FileTreeLine text="|   +-- evaluate.py              Evaluacion del sistema RAG con metricas" />
                                        <FileTreeLine text="|   +-- product_catalog.json     Datos estructurados de operadores" />
                                        <FileTreeLine text="|   +-- __init__.py" />
                                        <FileTreeLine text="|   |" />
                                        <FileTreeLine text="|   +-- graph/" />
                                        <FileTreeLine text="|       +-- state.py             Definicion del estado LangGraph (ChatState)" />
                                        <FileTreeLine text="|       +-- nodes.py             Nodos del grafo: classify, direct, product, retrieve, generate" />
                                        <FileTreeLine text="|       +-- build.py             Compilacion del grafo con checkpointer SQLite" />
                                        <FileTreeLine text="|       +-- __init__.py" />
                                        <FileTreeLine text="|" />
                                        <FileTreeLine text="+-- data/" />
                                        <FileTreeLine text="|   +-- raw/                     Datos crudos (no versionados)" />
                                        <FileTreeLine text="|   +-- processed/               Archivos .txt generados por el scraper" />
                                        <FileTreeLine text="|" />
                                        <FileTreeLine text="+-- vectorstore/                 ChromaDB persistido (generado, no versionado)" />
                                        <FileTreeLine text="+-- reports/" />
                                        <FileTreeLine text="|   +-- evaluation/              Resultados JSON de evaluacion RAG" />
                                        <FileTreeLine text="|" />
                                        <FileTreeLine text="+-- docker/" />
                                        <FileTreeLine text="|   +-- prometheus.yml           Configuracion de Prometheus" />
                                        <FileTreeLine text="|" />
                                        <FileTreeLine text="+-- tests/" />
                                        <FileTreeLine text="|   +-- test_scraper.py          Tests unitarios del scraper" />
                                        <FileTreeLine text="|   +-- test_api.py              Tests basicos de la API" />
                                        <FileTreeLine text="|" />
                                        <FileTreeLine text="+-- main.py                      Orquestador del pipeline completo" />
                                        <FileTreeLine text="+-- requirements.txt             Dependencias del proyecto" />
                                        <FileTreeLine text="+-- docker-compose.yml           Prometheus + Grafana" />
                                        <FileTreeLine text="+-- Makefile                     Comandos de gestion del proyecto" />
                                        <FileTreeLine text="+-- .env.example                 Plantilla de variables de entorno" />
                                        <FileTreeLine text="+-- .gitignore" />
                                        <FileTreeLine text="+-- README.md" />
                                    </div>
                                </div>
                            </div>

                        <section ref={archRef} className="py-24 px-4 sm:px-6 md:px-20 max-w-7xl mx-auto">
                            <div className={`text-center mb-16 md:mb-20 transition-all duration-700 ${archVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                                <h3 className="text-2xl md:text-3xl font-bold text-white mb-4">Arquitectura del Sistema</h3>
                                <p className="text-gray-400">Desglose técnico de las tres capas principales.</p>
                            </div>

                            {/* --- FLUJO CONVERSACIONAL --- */}
                            <div className="mb-24 md:mb-40 relative">
                                <h4 className="text-xl md:text-2xl font-semibold mb-10 md:mb-16 text-center text-blue-400 flex items-center justify-center gap-3">
                                    <Icon name="Network" /> Flujo Conversacional End-to-End
                                </h4>

                                <div className="flex flex-col items-start w-full max-w-3xl mx-auto pl-2 sm:pl-10 md:pl-20">
                                    <TreeNode label="Usuario" iconName="User" delay="0" isVisible={archVisible} color="cyan" tooltip="Cliente que interactúa vía Web, WhatsApp u otro canal." />

                                    <div style={{ transitionDelay: '100ms' }} className={`w-0.5 h-6 sm:h-8 ml-6 sm:ml-8 bg-gradient-to-b from-cyan-500/50 to-blue-500/50 transition-all duration-500 ${archVisible ? 'opacity-100 scale-y-100' : 'opacity-0 scale-y-0'} origin-top`}></div>

                                    <TreeNode label="Streamlit" desc="(interfaz web)" iconName="Bot" delay="200" isVisible={archVisible} color="blue" techBadge="Streamlit" tooltip="Frontend construido en Python para presentar la interfaz de GAIA al usuario final." />

                                    <TreeNode label="FastAPI" desc="(API REST)" iconName="Server" delay="400" isVisible={archVisible} color="purple" techBadge="FastAPI + Uvicorn" tooltip="Gateway asíncrono y robusto que recibe los requests del frontend y ejecuta la lógica." />

                                    <div style={{ transitionDelay: '500ms' }} className={`w-0.5 h-6 sm:h-8 ml-6 sm:ml-8 bg-purple-500/50 transition-all duration-500 ${archVisible ? 'opacity-100 scale-y-100' : 'opacity-0 scale-y-0'} origin-top`}></div>

                                    <TreeNode label="LangGraph" desc="(grafo conversacional)" iconName="Network" delay="600" isVisible={archVisible} color="purple" techBadge="LangGraph + SQLite" tooltip="Orquestador principal que maneja los estados de la IA y persiste la memoria en SQLite." />

                                    <div className="relative flex flex-col mt-0 ml-6 sm:ml-8">
                                        <div
                                            style={{ transitionDelay: '700ms' }}
                                            className={`absolute left-0 top-0 bottom-4 w-0.5 border-l-2 border-dashed border-purple-500/50 transition-all duration-1000 origin-top ${archVisible ? 'opacity-100 scale-y-100' : 'opacity-0 scale-y-0'}`}
                                        ></div>

                                        <BranchItem label="classify_node" desc="(router de intenciones)" iconName="GitBranch" delay="800" isVisible={archVisible} color="purple" tooltip="LLM inicial que detecta la intención y el sentimiento para enrutar la petición a la vía más rápida." />
                                        <BranchItem label="direct_node" desc="(respuestas sociales y empáticas)" iconName="MessageSquare" delay="900" isVisible={archVisible} color="purple" tooltip="Procesa saludos, agradecimientos o quejas urgentes sin consumir recursos RAG." />
                                        <BranchItem label="product_node" desc="(consultas comerciales y planes)" iconName="Zap" delay="1000" isVisible={archVisible} color="blue" tooltip="Se alimenta del catálogo JSON (product_catalog.json) para ventas y tarifas." />
                                        <BranchItem label="retrieve_node" desc="(búsqueda semántica)" iconName="Search" delay="1100" isVisible={archVisible} color="cyan" techBadge="ChromaDB" tooltip="Consulta la base de datos vectorial para inyectar contexto a las dudas técnicas del usuario." />
                                        <BranchItem label="generate_node" desc="(generación de respuesta)" iconName="Brain" delay="1200" isVisible={archVisible} color="purple" techBadge="Mistral AI (mistral-small)" badgeColor="orange" tooltip="El LLM principal que sintetiza toda la información y responde con empatía (IA centrada en el usuario)." />

                                        <div className="relative mt-4 ml-[2.5rem] sm:ml-[3rem] md:ml-[4.5rem]">
                                            <div
                                                style={{ transitionDelay: '1300ms' }}
                                                className={`absolute left-4 sm:left-6 top-[-20px] sm:top-[-30px] w-0.5 h-6 sm:h-8 bg-green-500/50 transition-all duration-500 origin-top ${archVisible ? 'opacity-100 scale-y-100' : 'opacity-0 scale-y-0'}`}
                                            ></div>

                                            <TreeNode label="MLflow Tracing" iconName="Activity" delay="1400" isVisible={archVisible} color="green" techBadge="MLflow" tooltip="Plataforma de observabilidad que monitoriza los tokens, latencia y ejecución del grafo." />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div ref={pipeRef} className="mb-10 md:mb-20 relative">
                                <div className={`transition-all duration-700 ${pipeVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                                    <h4 className="text-xl md:text-2xl font-semibold mb-10 md:mb-16 text-center text-cyan-400 flex items-center justify-center gap-3">
                                        <Icon name="Database" /> Pipeline de Ingesta RAG
                                    </h4>
                                </div>

                                <div className="flex flex-col items-start w-full max-w-3xl mx-auto pl-2 sm:pl-10 md:pl-20">
                                    <TreeNode label="Web Scraping" iconName="Globe" delay="0" isVisible={pipeVisible} color="cyan" techBadge="httpx + Playwright" badgeColor="cyan" tooltip="Script automatizado que extrae información oficial de las páginas de los operadores." />

                                    <div className="relative flex flex-col mt-0 ml-6 sm:ml-8">
                                        <div
                                            style={{ transitionDelay: '100ms' }}
                                            className={`absolute left-0 top-0 bottom-[-24px] w-0.5 border-l-2 border-dashed border-cyan-500/50 transition-all duration-1000 origin-top ${pipeVisible ? 'opacity-100 scale-y-100' : 'opacity-0 scale-y-0'}`}
                                        ></div>

                                        <BranchItem label="operador-a.com" iconName="Link" delay="200" isVisible={pipeVisible} color="cyan" tooltip="URL Semilla: Términos, condiciones y ayuda técnica del Operador A." />
                                        <BranchItem label="operador-b.com" iconName="Link" delay="300" isVisible={pipeVisible} color="blue" tooltip="URL Semilla: Documentación y centro de soporte del Operador B." />
                                        <BranchItem label="operador-c.com / ayuda..." iconName="Link" delay="400" isVisible={pipeVisible} color="purple" tooltip="URL Semilla: Base de conocimiento y PQR del Operador C." />
                                    </div>

                                    <div className="h-6 sm:h-8"></div>

                                    <TreeNode label="Procesamiento de texto" desc="(src/scraper.py)" iconName="FileText" delay="500" isVisible={pipeVisible} color="blue" techBadge="BeautifulSoup4" badgeColor="blue" tooltip="Limpia el código HTML escrapeado, eliminando scripts, estilos y ruido visual para dejar solo texto útil." />

                                    <div style={{ transitionDelay: '600ms' }} className={`w-0.5 h-6 sm:h-8 ml-6 sm:ml-8 bg-gradient-to-b from-blue-500/50 to-purple-500/50 transition-all duration-500 origin-top ${pipeVisible ? 'opacity-100 scale-y-100' : 'opacity-0 scale-y-0'}`}></div>

                                    <TreeNode label="data/processed/*.txt" iconName="FolderOpen" delay="700" isVisible={pipeVisible} color="purple" tooltip="Directorio intermedio que guarda los documentos limpios y listos para ser fragmentados." />

                                    <div style={{ transitionDelay: '800ms' }} className={`w-0.5 h-6 sm:h-8 ml-6 sm:ml-8 bg-purple-500/50 transition-all duration-500 origin-top ${pipeVisible ? 'opacity-100 scale-y-100' : 'opacity-0 scale-y-0'}`}></div>

                                    <TreeNode label="Chunking + Embeddings" desc="(src/ingest.py)" iconName="Layers" delay="900" isVisible={pipeVisible} color="purple" techBadge="Ollama (nomic-embed)" badgeColor="purple" tooltip="Divide los .txt en fragmentos (chunks) y los convierte en vectores numéricos capturando su significado semántico." />

                                    <div style={{ transitionDelay: '1000ms' }} className={`w-0.5 h-6 sm:h-8 ml-6 sm:ml-8 bg-gradient-to-b from-purple-500/50 to-green-500/50 transition-all duration-500 origin-top ${pipeVisible ? 'opacity-100 scale-y-100' : 'opacity-0 scale-y-0'}`}></div>

                                    <TreeNode label="ChromaDB" desc="(vectorstore/)" iconName="Database" delay="1100" isVisible={pipeVisible} color="green" techBadge="ChromaDB" badgeColor="green" tooltip="Almacenamiento vectorial en disco local que permite búsquedas rapidísimas basadas en similitud del coseno." />
                                </div>
                            </div>

                            {/* Global Tech & Environment Bar */}
                            <div className={`mt-16 md:mt-24 transition-all duration-1000 ${archVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                                <div className="max-w-2xl mx-auto flex flex-col sm:flex-row flex-wrap justify-center items-center gap-3 md:gap-4 bg-gray-900/40 border border-gray-800 rounded-2xl p-4 md:p-6 backdrop-blur-sm">
                                    <span className="text-gray-400 font-mono text-sm sm:mr-2 flex items-center gap-2 mb-2 sm:mb-0 w-full justify-center sm:w-auto"><Icon name="Code" size={16} /> Entorno Global:</span>
                                    <div className="flex flex-wrap justify-center gap-2">
                                        <span className="px-3 py-1 bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 rounded text-[10px] sm:text-xs font-mono">Python 3.11</span>
                                        <span className="px-3 py-1 bg-gray-800 text-gray-300 border border-gray-700 rounded text-[10px] sm:text-xs font-mono">uv + pip</span>
                                        <span className="px-3 py-1 bg-orange-500/10 text-orange-400 border border-orange-500/30 rounded text-[10px] sm:text-xs font-mono">Prometheus + Grafana</span>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>

                    {/* FOOTER */}
                    <footer className="py-8 text-center text-gray-600 text-sm border-t border-gray-800 relative z-10 px-4 bg-[#0a0a0e]">
                        <p>GAIA Telecom Chatbot © 2026. Basado en el repositorio GitHub oficial.</p>
                        <p className="mt-2 text-xs">IA Centrada en el Usuario • RAG • LangGraph</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
